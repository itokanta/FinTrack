name: deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "docs/**"
  #     - "**/*.md"

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          BASE="s3://${S3_BUCKET}/releases/${GITHUB_SHA}"
          aws s3 cp target/fintrack-0.0.1-SNAPSHOT.jar "${BASE}/fintrack.jar"
          aws s3 cp deploy/deploy.sh "${BASE}/deploy.sh"
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Restart on EC2
        run: |
          set -euo pipefail
          BASE="s3://${S3_BUCKET}/releases/${GITHUB_SHA}"
          PARAMS="$(jq -cn --arg base "${BASE}" '{commands: [
            "set -eu",
            "aws s3 cp \($base)/deploy.sh /tmp/fintrack-deploy.new",
            "install -o root -g root -m 755 /tmp/fintrack-deploy.new /usr/local/sbin/fintrack-deploy",
            "rm -f /tmp/fintrack-deploy.new",
            "/usr/local/sbin/fintrack-deploy \($base)/fintrack.jar"
          ]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "${PARAMS}" \
            --query Command.CommandId \
            --output text)"

          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"
            echo "status=${STATUS}"
            case "${STATUS}" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "timed out waiting for SSM" >&2
          exit 1
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}