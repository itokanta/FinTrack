spring.application.name=fintrack

# nginx リバースプロキシの裏で localhost のみ待ち受け
server.address=127.0.0.1

# nginx の X-Forwarded-* を信頼
server.forward-headers-strategy=native
# セッション Cookie を HTTPS 専用に
server.servlet.session.cookie.secure=true


# Database Configuration
spring.datasource.url=${DB_APP}
# spring.datasource.url=${DB_DEV}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Configuration
# JDBCTemplateを使用するため、JPAの設定は不要

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Configuration
spring.thymeleaf.cache=true

# Logging
logging.level.com.example.fintrack=INFO
logging.level.org.springframework.security=INFO

# ログファイル出力
logging.file.name=/var/log/fintrack/fintrack.log
logging.logback.rollingpolicy.file-name-pattern=/var/log/fintrack/fintrack.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB