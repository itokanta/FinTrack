<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>カード差異一覧</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">カード支払い差異一覧</h2>
        
        <!-- 未解決の差異 -->
        <div th:if="${!#lists.isEmpty(unresolvedDiscrepancies)}" class="alert alert-warning">
            <p class="alert-emphasis mb-0"><i class="bi bi-exclamation-triangle"></i> 未解決の差異があります</p>
            <p class="mb-0">銀行引き落とし額と家計簿上のカード利用額に差異があります。</p>
        </div>
        
        <h3 class="content-heading mt-4">未解決の差異</h3>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>支払い月</th>
                        <th class="text-end">家計簿上の金額</th>
                        <th class="text-end">実際の引き落とし額</th>
                        <th class="text-end">差異</th>
                        <th>登録日時</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="discrepancy : ${unresolvedDiscrepancies}">
                        <td th:text="${discrepancy.paymentMonth}">2025-01</td>
                        <td class="text-end" th:text="${#numbers.formatInteger(discrepancy.expectedAmount, 0, 'COMMA')} + '円'">0円</td>
                        <td class="text-end" th:text="${#numbers.formatInteger(discrepancy.actualAmount, 0, 'COMMA')} + '円'">0円</td>
                        <td class="text-end">
                            <span th:classappend="${discrepancy.differenceAmount > 0} ? 'text-danger fw-bold' : 'text-success fw-bold'"
                                  th:text="${(discrepancy.differenceAmount > 0 ? '+' : '') + #numbers.formatInteger(discrepancy.differenceAmount, 0, 'COMMA')} + '円'">0円</span>
                        </td>
                        <td th:text="${#temporals.format(discrepancy.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 00:00</td>
                        <td>
                            <a th:href="@{/discrepancy-transactions/{id}/resolve(id=${discrepancy.id})}" 
                               class="btn btn-sm btn-primary">
                                <i class="bi bi-pencil-square"></i> 解決する
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(unresolvedDiscrepancies)}">
                        <td colspan="6" class="text-center text-muted">
                            <i class="bi bi-check-circle text-success"></i> 未解決の差異はありません
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <h3 class="content-heading mt-5">すべての差異履歴</h3>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>支払い月</th>
                        <th class="text-end">家計簿上の金額</th>
                        <th class="text-end">実際の引き落とし額</th>
                        <th class="text-end">差異</th>
                        <th>状態</th>
                        <th>登録日時</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="discrepancy : ${allDiscrepancies}">
                        <td th:text="${discrepancy.paymentMonth}">2025-01</td>
                        <td class="text-end" th:text="${#numbers.formatInteger(discrepancy.expectedAmount, 0, 'COMMA')} + '円'">0円</td>
                        <td class="text-end" th:text="${#numbers.formatInteger(discrepancy.actualAmount, 0, 'COMMA')} + '円'">0円</td>
                        <td class="text-end">
                            <span th:classappend="${discrepancy.differenceAmount > 0} ? 'text-danger' : 'text-success'"
                                  th:text="${(discrepancy.differenceAmount > 0 ? '+' : '') + #numbers.formatInteger(discrepancy.differenceAmount, 0, 'COMMA')} + '円'">0円</span>
                        </td>
                        <td>
                            <span th:if="${discrepancy.isResolved}" class="badge bg-success">
                                <i class="bi bi-check-circle"></i> 解決済み
                            </span>
                            <span th:unless="${discrepancy.isResolved}" class="badge bg-warning">
                                <i class="bi bi-clock"></i> 未解決
                            </span>
                        </td>
                        <td th:text="${#temporals.format(discrepancy.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 00:00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(allDiscrepancies)}">
                        <td colspan="6" class="text-center text-muted">
                            差異の履歴はありません
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
