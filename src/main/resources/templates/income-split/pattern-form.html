<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>分割パターン登録</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">分割パターン登録</h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="@{/income-split/patterns}" method="post">
                    <div class="mb-3">
                        <label for="patternName" class="form-label">パターン名</label>
                        <input type="text" class="form-control" id="patternName" name="patternName" required>
                    </div>
                    
                    <h5 class="mb-3">分割割合（合計100%）</h5>
                    
                    <div th:each="category : ${categories}" class="mb-3">
                        <label th:for="'ratio_' + ${category.id}" class="form-label" th:text="${category.categoryName}">カテゴリ名</label>
                        <div class="input-group">
                            <input type="number" 
                                   class="form-control" 
                                   th:id="'ratio_' + ${category.id}" 
                                   th:name="'ratio_' + ${category.id}" 
                                   min="0" 
                                   max="100" 
                                   step="0.01" 
                                   value="0">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">登録</button>
                    <a th:href="@{/income-split/patterns}" class="btn btn-secondary">キャンセル</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
