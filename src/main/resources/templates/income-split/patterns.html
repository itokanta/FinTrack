<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>収入分割パターン管理</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">収入分割パターン管理</h2>
        
        <div class="mb-3">
            <a th:href="@{/income-split/patterns/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> 新規パターン作成
            </a>
        </div>
        
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">登録済みパターン</h5>
                <ul class="list-group">
                    <li class="list-group-item" th:each="patternId : ${patternIds}">
                        パターンID: <span th:text="${patternId}">1</span>
                    </li>
                </ul>
                <p th:if="${#lists.isEmpty(patternIds)}" class="text-muted mt-3">
                    登録済みのパターンはありません
                </p>
            </div>
        </div>
    </div>
</body>
</html>
