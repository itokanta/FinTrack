<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録 - FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .register-form {
            width: 100%;
            max-width: 400px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="register-form">
        <form th:action="@{/register}" method="post" class="card p-4 shadow">
            <h2 class="text-center mb-4">ユーザー登録</h2>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}">エラー</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div class="mb-3">
                <label for="username" class="form-label">ユーザー名</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
                <div class="form-text">半角英数字、記号が使用できます</div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="6">
                <div class="form-text">6文字以上で入力してください</div>
            </div>
            
            <div class="mb-3">
                <label for="passwordConfirm" class="form-label">パスワード（確認）</label>
                <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">登録</button>
            
            <div class="text-center">
                <a th:href="@{/login}" class="text-decoration-none">ログイン画面に戻る</a>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
