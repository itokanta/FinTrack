<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>収入詳細</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">収入詳細</h2>
        
        <!-- メッセージ表示 -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}">メッセージ</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">エラー</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- 取引情報 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">取引情報</h5>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">取引日</dt>
                    <dd class="col-sm-9" th:text="${transaction.transactionDate}">2024-01-01</dd>
                    
                    <dt class="col-sm-3">摘要</dt>
                    <dd class="col-sm-9" th:text="${transaction.description}">摘要</dd>
                    
                    <dt class="col-sm-3">金額</dt>
                    <dd class="col-sm-9" th:text="${#numbers.formatInteger(transaction.amount, 0, 'COMMA')} + '円'">0円</dd>
                    
                    <dt class="col-sm-3">取引区分</dt>
                    <dd class="col-sm-9" th:text="${type == 'bank' ? '銀行' : 'カード'}">銀行</dd>
                    
                    <dt class="col-sm-3">分配ステータス</dt>
                    <dd class="col-sm-9">
                        <span th:if="${isSplit}" class="badge bg-success">分配済み</span>
                        <span th:unless="${isSplit}" class="badge bg-warning">未分配</span>
                    </dd>
                </dl>
            </div>
        </div>
        
        <!-- 分配済みの場合は分配内容を表示 -->
        <div th:if="${isSplit}" class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">分配内容</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>資産カテゴリ</th>
                            <th class="text-end">金額</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="split : ${splitIncomes}">
                            <td th:text="${assetCategoryMap.get(split.assetCategoryId)}">カテゴリ名</td>
                            <td class="text-end" th:text="${#numbers.formatInteger(split.amount, 0, 'COMMA')} + '円'">0円</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th>合計</th>
                            <th class="text-end" th:text="${#numbers.formatInteger(transaction.amount, 0, 'COMMA')} + '円'">0円</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
        
        <!-- 未分配の場合は分配フォームを表示 -->
        <div th:unless="${isSplit}">
            <!-- 全額を1つのカテゴリに登録 -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">全額を1つのカテゴリに分配</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/income-split/split-single}" method="post">
                        <input type="hidden" name="bankTransactionId" th:value="${type == 'bank' ? transaction.id : null}">
                        <input type="hidden" name="cardTransactionId" th:value="${type == 'card' ? transaction.id : null}">
                        
                        <div class="mb-3">
                            <label for="singleCategoryId" class="form-label">資産カテゴリ</label>
                            <select class="form-select" id="singleCategoryId" name="categoryId" required>
                                <option value="">選択してください</option>
                                <option th:each="category : ${assetCategories}" 
                                        th:value="${category.id}" 
                                        th:text="${category.categoryName}">
                                    カテゴリ名
                                </option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">分配する</button>
                    </form>
                </div>
            </div>
            
            <!-- 分割パターンで分配 -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">分割パターンで分配</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/income-split/split}" method="post">
                        <input type="hidden" name="bankTransactionId" th:value="${type == 'bank' ? transaction.id : null}">
                        <input type="hidden" name="cardTransactionId" th:value="${type == 'card' ? transaction.id : null}">
                        
                        <div class="mb-3">
                            <label for="patternId" class="form-label">分割パターン</label>
                            <select class="form-select" id="patternId" name="patternId" required>
                                <option value="">選択してください</option>
                                <option th:each="pattern : ${patternSummaries}" 
                                        th:value="${pattern.id}" 
                                        th:text="${pattern.name}">
                                    パターン
                                </option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">分配する</button>
                    </form>
                    
                    <div class="mt-3">
                        <a th:href="@{/income-split/patterns}" class="btn btn-sm btn-outline-secondary">分割パターン管理</a>
                    </div>
                </div>
            </div>
        </div>
        
        <a th:href="@{/transactions/incomes}" class="btn btn-secondary">戻る</a>
    </div>
</body>
</html>
