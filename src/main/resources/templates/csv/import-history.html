<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>CSV登録履歴</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4"><i class="bi bi-clock-history"></i> CSV登録履歴</h2>

        <div th:if="${#lists.isEmpty(histories)}" class="text-center text-muted py-5">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
            CSV登録履歴がありません
        </div>

        <div th:unless="${#lists.isEmpty(histories)}" class="table-responsive">
            <table class="table table-striped align-middle csv-import-history-table">
                <thead>
                    <tr>
                        <th>種別</th>
                        <th>ファイル名</th>
                        <th>登録日時</th>
                        <th class="text-end">登録件数</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h : ${histories}"
                        class="monthly-transaction-row-link"
                        th:data-href="@{/csv/import/history/{id}(id=${h.id})}">
                        <td>
                            <span th:if="${h.importType == 'BANK'}" class="badge bg-primary">
                                <i class="bi bi-bank"></i> 銀行
                            </span>
                            <span th:if="${h.importType == 'CARD'}" class="badge bg-warning text-dark">
                                <i class="bi bi-credit-card"></i> カード
                            </span>
                        </td>
                        <td th:text="${h.csvName}">filename.csv</td>
                        <td th:text="${#temporals.format(h.importDate, 'yyyy-MM-dd HH:mm')}">2025-01-01 00:00</td>
                        <td class="text-end" th:text="${h.recordCount} + '件'">0件</td>
                        <td class="d-none d-md-table-cell">
                            <a th:href="@{/csv/import/history/{id}(id=${h.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-search"></i> 詳細
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script>
            document.querySelectorAll('.monthly-transaction-row-link').forEach(function (row) {
                row.addEventListener('click', function () {
                    if (window.matchMedia('(max-width: 767.98px)').matches && row.dataset.href) {
                        window.location.href = row.dataset.href;
                    }
                });
            });
        </script>
    </div>
</body>
</html>
