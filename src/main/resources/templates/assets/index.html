<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>資産</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">資産</h2>
            <a th:href="@{/assets/confirmed}" class="btn btn-outline-primary">
                <i class="bi bi-check-circle"></i> 確定済み資産
            </a>
        </div>
        
        <!-- 総資産 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">総資産</h5>
                <h2 class="text-primary" th:text="${#numbers.formatInteger(totalBalance, 0, 'COMMA')} + '円'">0円</h2>
            </div>
        </div>
        
        <!-- カテゴリ別残高 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">カテゴリ別残高</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>カテゴリ</th>
                            <th class="text-end">残高</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${balances}">
                            <td th:text="${entry.key.categoryName}">カテゴリ名</td>
                            <td class="text-end" th:text="${#numbers.formatInteger(entry.value, 0, 'COMMA')} + '円'">0円</td>
                        </tr>
                        <!-- 未分類の残高がある場合 -->
                        <tr th:if="${uncategorizedBalance != 0}" class="table-warning">
                            <td>
                                <a th:href="@{/assets/uncategorized}" class="text-decoration-none text-dark">
                                    未分類
                                </a>
                            </td>
                            <td class="text-end" th:text="${#numbers.formatInteger(uncategorizedBalance, 0, 'COMMA')} + '円'">0円</td>
                        </tr>
                        <!-- データがない場合 -->
                        <tr th:if="${#lists.isEmpty(balances) && uncategorizedBalance == 0}">
                            <td colspan="2" class="text-muted text-center">データがありません</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
