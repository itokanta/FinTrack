<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${transactionType.name() == 'INCOME' ? '収入分割パターン管理' : '支出分割パターン管理'}">分割パターン管理</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4" th:text="${transactionType.name() == 'INCOME' ? '収入分割パターン管理' : '支出分割パターン管理'}">分割パターン管理</h2>
        
        <!-- メッセージ表示 -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}">メッセージ</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">エラー</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div class="mb-3">
            <a th:href="${transactionType.name() == 'INCOME' ? '/split/income/patterns/new' : '/split/expense/patterns/new'}" 
               class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> 新規パターン作成
            </a>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">登録済みパターン</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>パターン名</th>
                                <th>分割方法</th>
                                <th>分割内容</th>
                                <th style="width: 150px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pattern : ${splitPatternGroupList}">
                                <td>
                                    <strong th:text="${pattern.patternName}">パターン名</strong>
                                    <br>
                                    <small class="text-muted">ID: <span th:text="${pattern.id}">1</span></small>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${pattern.splitType == 'RATIO' ? 'bg-primary' : 'bg-success'}"
                                          th:text="${pattern.splitType == 'RATIO' ? '割合指定' : '金額指定'}">
                                        割合指定
                                    </span>
                                </td>
                                <td>
                                    <div th:each="detail : ${pattern.splitPatternList}" class="mb-1">
                                        <span class="badge bg-info" th:text="${detail.assetCategoryName}">カテゴリ</span>
                                        <span th:if="${pattern.splitType == 'RATIO'}" 
                                              th:text="${detail.splitRatio} + '%'">50%</span>
                                        <span th:if="${pattern.splitType == 'AMOUNT'}" 
                                              th:text="${#numbers.formatInteger(detail.splitAmount, 0, 'COMMA')} + '円'">10,000円</span>
                                    </div>
                                </td>
                                <td>
                                    <form th:action="@{/split/patterns/{id}/delete(id=${pattern.id})}" 
                                          method="post" 
                                          class="d-inline"
                                          onsubmit="return confirm('このパターンを削除してもよろしいですか？');">
                                        <input type="hidden" name="transactionType" th:value="${transactionType.name()}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i> 削除
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(splitPatternGroupList)}">
                                <td colspan="4" class="text-center text-muted">
                                    登録済みのパターンはありません
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a th:href="${transactionType.name() == 'INCOME' ? '/transactions/incomes' : '/transactions/expenses'}" 
               class="btn btn-secondary">戻る</a>
        </div>
    </div>
</body>
</html>
