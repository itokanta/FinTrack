<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${transactionType == 'INCOME' ? '収入分割パターン登録' : '支出分割パターン登録'}">分割パターン登録</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4" th:text="${transactionType == 'INCOME' ? '収入分割パターン登録' : '支出分割パターン登録'}">分割パターン登録</h2>
        
        <div class="card">
            <div class="card-body">
                <!-- 分割方法選択 -->
                <div class="mb-4">
                    <label class="form-label fw-bold">分割方法を選択</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="splitTypeRadio" id="splitTypeRatio" checked>
                        <label class="btn btn-outline-primary" for="splitTypeRatio">割合指定</label>
                        
                        <input type="radio" class="btn-check" name="splitTypeRadio" id="splitTypeAmount">
                        <label class="btn btn-outline-success" for="splitTypeAmount">金額指定</label>
                    </div>
                </div>
                
                <!-- 割合指定フォーム -->
                <form id="ratioForm" th:action="@{/split/patterns/ratio}" method="post">
                    <input type="hidden" name="transactionType" th:value="${transactionType}">
                    
                    <div class="mb-3">
                        <label for="patternNameRatio" class="form-label">パターン名</label>
                        <input type="text" class="form-control" id="patternNameRatio" name="patternName" required>
                    </div>
                    
                    <h5 class="mb-3">分割割合（合計100%）</h5>
                    <div id="ratioTotalDisplay" class="mb-3">
                        <span class="badge bg-secondary">合計: <span id="ratioTotal">0</span>%</span>
                    </div>
                    
                    <div th:each="category : ${categories}" class="mb-3">
                        <label th:for="'ratio_' + ${category.id}" 
                               class="form-label" 
                               th:text="${category.categoryName}">カテゴリ名</label>
                        <div class="input-group">
                            <input type="number" 
                                   class="form-control ratio-input" 
                                   th:id="'ratio_' + ${category.id}" 
                                   th:name="'ratio_' + ${category.id}" 
                                   min="0" 
                                   max="100" 
                                   step="0.01" 
                                   value="0">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    
                    <button type="submit" id="ratioSubmit" class="btn btn-primary" disabled>登録</button>
                    <a th:href="${transactionType == 'INCOME' ? '/split/income/patterns' : '/split/expense/patterns'}" 
                       class="btn btn-secondary">キャンセル</a>
                </form>
                
                <!-- 金額指定フォーム -->
                <form id="amountForm" th:action="@{/split/patterns/amount}" method="post" style="display:none;">
                    <input type="hidden" name="transactionType" th:value="${transactionType}">
                    
                    <div class="mb-3">
                        <label for="patternNameAmount" class="form-label">パターン名</label>
                        <input type="text" class="form-control" id="patternNameAmount" name="patternName" required>
                    </div>
                    
                    <h5 class="mb-3">分割金額</h5>
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 
                        金額を入力したカテゴリのみパターンに含まれます。合計金額は取引金額と一致する必要があります。
                    </div>
                    
                    <div th:each="category : ${categories}" class="mb-3">
                        <label th:for="'amount_' + ${category.id}" 
                               class="form-label" 
                               th:text="${category.categoryName}">カテゴリ名</label>
                        <div class="input-group">
                            <input type="number" 
                                   class="form-control amount-input" 
                                   th:id="'amount_' + ${category.id}" 
                                   th:name="'amount_' + ${category.id}" 
                                   min="0" 
                                   step="1" 
                                   value="0">
                            <span class="input-group-text">円</span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">登録</button>
                    <a th:href="${transactionType == 'INCOME' ? '/split/income/patterns' : '/split/expense/patterns'}" 
                       class="btn btn-secondary">キャンセル</a>
                </form>
            </div>
        </div>
    </div>
    
    <script layout:fragment="scripts">
        // 分割方法切り替え
        document.getElementById('splitTypeRatio').addEventListener('change', function() {
            if (this.checked) {
                document.getElementById('ratioForm').style.display = 'block';
                document.getElementById('amountForm').style.display = 'none';
            }
        });
        
        document.getElementById('splitTypeAmount').addEventListener('change', function() {
            if (this.checked) {
                document.getElementById('ratioForm').style.display = 'none';
                document.getElementById('amountForm').style.display = 'block';
            }
        });
        
        // 割合指定の合計計算
        function updateRatioTotal() {
            const inputs = document.querySelectorAll('.ratio-input');
            let total = 0;
            
            inputs.forEach(input => {
                const value = parseFloat(input.value) || 0;
                total += value;
            });
            
            document.getElementById('ratioTotal').textContent = total.toFixed(2);
            
            // 合計が100%の場合のみ送信ボタンを有効化
            const submitButton = document.getElementById('ratioSubmit');
            if (Math.abs(total - 100) < 0.01) {
                submitButton.disabled = false;
                document.getElementById('ratioTotalDisplay').querySelector('.badge').className = 'badge bg-success';
            } else {
                submitButton.disabled = true;
                document.getElementById('ratioTotalDisplay').querySelector('.badge').className = 'badge bg-secondary';
            }
        }
        
        document.querySelectorAll('.ratio-input').forEach(input => {
            input.addEventListener('input', updateRatioTotal);
        });
        
        // 初期化
        updateRatioTotal();
    </script>
</body>
</html>
