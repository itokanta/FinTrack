<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- ヘッダーナビゲーション -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary" sec:authorize="isAuthenticated()">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">
                    <i class="bi bi-wallet2"></i> FinTrack
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="assetsDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-piggy-bank"></i> 資産
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{/assets}">
                                        <i class="bi bi-wallet2"></i> 資産管理
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/monthly-report}">
                                        <i class="bi bi-bar-chart-line"></i> 収支レポート
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="transactionsDropdown" role="button" 
                               data-bs-toggle="dropdown">
                                <i class="bi bi-list-ul"></i> 月次取引一覧
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{/transactions/expenses}">
                                        <i class="bi bi-arrow-down-circle text-danger"></i> 支出一覧
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/transactions/incomes}">
                                        <i class="bi bi-arrow-up-circle text-success"></i> 収入一覧
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="csvDropdown" role="button"
                               data-bs-toggle="dropdown">
                                <i class="bi bi-file-earmark-arrow-up"></i> CSV
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{/csv/import}">
                                        <i class="bi bi-upload"></i> CSV取込
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/csv/import/history}">
                                        <i class="bi bi-clock-history"></i> CSV登録履歴
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="splitDropdown" role="button" 
                               data-bs-toggle="dropdown">
                                <i class="bi bi-pie-chart"></i> 分割管理
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{/split/income/patterns}">
                                        <i class="bi bi-arrow-up-circle text-success"></i> 収入分割パターン
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/split/expense/patterns}">
                                        <i class="bi bi-arrow-down-circle text-danger"></i> 支出分割パターン
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/categories}">
                                <i class="bi bi-folder"></i> カテゴリ管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/auto-category-rules}">
                                <i class="bi bi-magic"></i> 自動分類ルール
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="cardPaymentDropdown" role="button" 
                               data-bs-toggle="dropdown">
                                <i class="bi bi-credit-card"></i> カード管理
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{/card-payments/by-month}">
                                        <i class="bi bi-calendar-month"></i> 支払い月別明細
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/card-payments/discrepancies}">
                                        <i class="bi bi-exclamation-triangle"></i> カード差異
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <span class="navbar-text me-3">
                            <i class="bi bi-person-circle"></i> <span sec:authentication="name">ユーザー名</span>
                        </span>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">
                                <i class="bi bi-box-arrow-right"></i> ログアウト
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
