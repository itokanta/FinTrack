spring.application.name=fintrack

# Database Configuration
# spring.datasource.url=${DB_APP}
spring.datasource.url=${DB_DEV}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Configuration
# JDBCTemplateを使用するため、JPAの設定は不要

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging
logging.level.com.example.fintrack=INFO
logging.level.org.springframework.security=INFO

# ログファイル出力（コンソールにも同時出力される）
logging.file.name=logs/fintrack-dev.log
# 日次で切り替え（1日1ファイル）。%i はサイズ分割時の連番
logging.logback.rollingpolicy.file-name-pattern=logs/fintrack-dev.%d{yyyy-MM-dd}.%i.gz
# 1ファイルの上限サイズ（超えたら分割）
logging.logback.rollingpolicy.max-file-size=50MB
# 30日分保持
logging.logback.rollingpolicy.max-history=30
# 全ログ合計の上限（超えたら古い順に削除）
logging.logback.rollingpolicy.total-size-cap=1GB